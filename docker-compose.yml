services:
  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: audio-capture-api
    environment:
      - CONFIG_FILE=/app/config/settings.yaml
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:ro
    ports:
      - "8000:8000"

  ui-streamlit:
    build:
      context: .
      dockerfile: docker/ui-streamlit/Dockerfile
    container_name: audio-capture-ui
    depends_on:
      - api
    environment:
      - CONFIG_FILE=/app/config/settings.yaml
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:ro
    ports:
      - "8501:8501"

  worker-discovery:
    build:
      context: .
      dockerfile: docker/worker-discovery/Dockerfile
    container_name: audio-capture-worker-discovery
    environment:
      - CONFIG_FILE=/app/config/settings.yaml
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:ro
    entrypoint: ["python", "/app/apps/worker-discovery/main.py"]

  worker-download:
    build:
      context: .
      dockerfile: docker/worker-download/Dockerfile
    container_name: audio-capture-worker-download
    environment:
      - CONFIG_FILE=/app/config/settings.yaml
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:ro
    entrypoint: ["python", "/app/apps/worker-download/main.py"]

  worker-convert:
    build:
      context: .
      dockerfile: docker/worker-convert/Dockerfile
    container_name: audio-capture-worker-convert
    environment:
      - CONFIG_FILE=/app/config/settings.yaml
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:ro
    entrypoint: ["python", "/app/apps/worker-convert/main.py"]

  worker-telegram-prep:
    build:
      context: .
      dockerfile: docker/worker-telegram-prep/Dockerfile
    container_name: audio-capture-worker-telegram-prep
    environment:
      - CONFIG_FILE=/app/config/settings.yaml
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:ro

  worker-transcript:
    build:
      context: .
      dockerfile: docker/worker-transcript/Dockerfile
    container_name: audio-capture-worker-transcript
    environment:
      - CONFIG_FILE=/app/config/settings.yaml
    volumes:
      - ./data:/app/data:rw
      - ./config:/app/config:ro
    entrypoint: ["python", "/app/apps/worker-transcript/main.py"]
